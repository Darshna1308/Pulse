name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ml:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/ml/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
      - name: Train and evaluate the default model
        run: |
          python -m pulse_ml.train
          python -m pulse_ml.evaluate

  api:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:8.0
        ports: ["27017:27017"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck -w apps/api
      - run: npm test -w apps/api
      - run: npm run build -w apps/api

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint -w apps/web
      - run: npm test -w apps/web
      - run: npm run build -w apps/web

  e2e:
    runs-on: ubuntu-latest
    needs: [ml, api]
    services:
      mongo:
        image: mongo:8.0
        ports: ["27017:27017"]
    env:
      MONGODB_URI: mongodb://127.0.0.1:27017/pulse_e2e
      JWT_ACCESS_SECRET: ci-only-access-secret-0123456789abcdef0123
      API_KEY_PEPPER: ci-only-api-key-pepper-0123456789abcdef0123
      ML_SERVICE_TOKEN: ci-only-internal-token
      PULSE_ML_INTERNAL_TOKEN: ci-only-internal-token
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/ml/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: pip install -r services/ml/requirements.txt
      - run: npm ci
      - name: Train model and start services
        run: |
          (cd services/ml && python -m pulse_ml.train && nohup uvicorn pulse_ml.api:app --port 8000 > /tmp/ml.log 2>&1 &)
          npm run build -w apps/api
          (cd apps/api && nohup node dist/server.js > /tmp/api.log 2>&1 &)
          for i in $(seq 1 60); do curl -sf localhost:4000/health && curl -sf localhost:8000/health && break; sleep 2; done
      - run: npm run e2e
      - if: failure()
        run: tail -n 100 /tmp/ml.log /tmp/api.log
